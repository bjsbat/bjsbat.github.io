name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: "ecs-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static files to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add ECS host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Verify source before deploy
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in workspace. Aborting deploy."
            exit 1
          fi
          echo "Source verified: index.html and $(ls css/main.css 2>/dev/null && echo 'css/main.css' || true) present"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='.claude' \
            --exclude='docs' \
            --exclude='memory' \
            --exclude='README.md' \
            --exclude='.cursor' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/usr/share/nginx/html/

      - name: Verify deployment
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "ls -la /usr/share/nginx/html/index.html /usr/share/nginx/html/css/main.css /usr/share/nginx/html/robots.txt && echo 'All files verified'"
          echo "Deployment verified successfully"

      - name: Baidu 主动推送
        if: success()
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          printf 'http://bjsbat.cn/\n' > urls.txt
          echo "Pushing $(wc -l < urls.txt) URL(s) to Baidu..."
          curl -sS -H 'Content-Type:text/plain' \
            --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=bjsbat.cn&token=${BAIDU_PUSH_TOKEN}"
          echo
